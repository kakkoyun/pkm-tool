[project]
name = "pkm-tool"
version = "0.1.0"
description = "Personal Knowledge Management Tool to fetch and format data from several resources"
readme = "README.md"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.7",
    "python-dateutil>=2.9.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "PyGithub>=2.0.0",
    "atlassian-python-api>=3.41.0",
    "things-py>=0.0.15",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "hishel>=1.1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.6.0",
    "syrupy>=4.6.0",
    "respx>=0.21.0",
    "responses>=0.25.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a27",
    "pre-commit>=4.0.0",
    "shellcheck-py>=0.10.0",
    "actionlint-py>=1.7.0",
    "yamllint>=1.35.0",
    "mdformat>=0.7.17",
]

[project.scripts]
pkm = "pkm_tool.cli:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.ty]
# Astral's ty type checker configuration
# Add specific ty configuration here as needed

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "snapshot: Snapshot tests",
]
addopts = "--verbose --cov=src/pkm_tool --cov-fail-under=80"
filterwarnings = [
    "ignore::ResourceWarning:unittest.mock",
]
