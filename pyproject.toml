[project]
name = "pkm-tool"
version = "0.1.0"
description = "Personal Knowledge Management Tool to fetch and format data from several resources"
readme = "README.md"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.7",
    "python-dateutil>=2.9.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a27",
    "pre-commit>=4.0.0",
    "shellcheck-py>=0.10.0",
    "actionlint-py>=1.7.0",
    "yamllint>=1.35.0",
    "mdformat>=0.7.17",
]

[project.scripts]
pkm = "pkm_tool.cli:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.ty]
# Astral's ty type checker configuration
# Add specific ty configuration here as needed

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
