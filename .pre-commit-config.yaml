repos:
  # Standard checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/__snapshots__/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  # Python - ruff linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # Shell scripts - shellcheck
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # Shell scripts - shfmt formatting
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt shell formatter
        entry: shfmt
        language: system
        types: [shell]
        args: [-i, "2", -ci, -w]
  # GitHub Actions - actionlint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.9
    hooks:
      - id: actionlint
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.35.0
    hooks:
      - id: check-github-actions
      - id: check-github-workflows
  # YAML - yamllint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-f, parsable, -c, .config/yamllint.yaml]
  # Markdown - mdformat
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-black
  # Markdown - markdownlint linting
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint linter
        entry: npx
        language: system
        types: [markdown]
        args: [--yes, markdownlint-cli, --config, .config/markdownlint.json, --ignore-path, .config/markdownlintignore]
  # Makefile - checkmake
  - repo: https://github.com/mrtazz/checkmake
    rev: 0.2.2
    hooks:
      - id: checkmake
        args: [--config=.config/checkmake.ini]
  # Conventional Commits - commitlint
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional@19.8.1']
  # Python security - bandit
  - repo: local
    hooks:
      - id: bandit
        name: bandit security linter
        entry: uv run bandit
        language: system
        types: [python]
        pass_filenames: false
        args: [-r, src/, -c, pyproject.toml, -q]
  # Python type checking - ty (local)
  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: skylos
        name: skylos report (gate)
        entry: uv run skylos
        language: system
        pass_filenames: false
        require_serial: true
        args: ["--json", "--output", "skylos_report.json", "--quality", "--danger", "--gate", "."]
      - id: complexipy
        name: complexipy complexity gate
        entry: uv run complexipy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        args: [".", "--max-complexity-allowed", "25", "--failed", "--output-json"]
