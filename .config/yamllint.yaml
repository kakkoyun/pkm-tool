extends: default

ignore: |
  .venv/
  venv/
  .tox/
  node_modules/

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
  comments:
    min-spaces-from-content: 1 # Allow 1 space before inline comments (ratchet style)
  comments-indentation: disable
