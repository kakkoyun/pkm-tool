name: Commitlint

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: Validate commit messages
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # ratchet:astral-sh/setup-uv@v7

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # ratchet:actions/setup-node@v4
        with:
          node-version: '20'

      - run: uv python install

      - run: make tools/install

      - name: Validate current commit (for push)
        if: github.event_name == 'push'
        run: make lint/commits

      - name: Validate PR commits (for pull_request)
        if: github.event_name == 'pull_request'
        run: |
          make lint/commits/range \
            FROM=${{ github.event.pull_request.base.sha }} \
            TO=${{ github.event.pull_request.head.sha }}
